<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion – Merrytti</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #f7f7f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h1 { font-size: 24px; margin-bottom: 10px; }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    button { width: 100%; padding: 12px; background: #c62828; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .error { background: #ffebee; color: #c62828; padding: 10px; border-radius: 6px; margin-bottom: 20px; display: none; }
    a { color: #c62828; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Connexion</h1>
    <div class="error" id="msgErreur"></div>
    <form id="formConnexion">
      <input type="hidden" id="csrf_jeton" value="">
      <div class="field">
        <label for="identifiant">Nom d'utilisateur ou email</label>
        <input type="text" id="identifiant" required>
      </div>
      <div class="field">
        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" required>
      </div>
      <button type="submit">Se connecter</button>
    </form>
    <p style="text-align:center; margin-top:20px;">Pas de compte ? <a href="inscription.html">Inscrivez-vous</a></p>
  </div>

  <script>
    // Récupération du token CSRF
    async function chargerCsrf() {
      try {
        const rep = await fetch('api/csrf_jeton.php');
        const data = await rep.json();
        document.getElementById('csrf_jeton').value = data.jeton;
      } catch(e) {}
    }
    chargerCsrf();

    document.getElementById('formConnexion').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erreur = document.getElementById('msgErreur');
      erreur.style.display = 'none';

      const identifiant = document.getElementById('identifiant').value.trim();
      const mot_de_passe = document.getElementById('mot_de_passe').value;
      const csrf = document.getElementById('csrf_jeton').value;

      try {
        const rep = await fetch('api/connexion.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifiant, mot_de_passe, csrf_jeton: csrf })
        });
        const data = await rep.json();
        if (!rep.ok) throw new Error(data.erreur);
        if (data.role === 'admin' || data.role === 'secretaire') {
  window.location.href = 'admin/tableau-de-bord.html';
} else {
  window.location.href = 'index.html';
}
        } catch (err) {
    if (err.message === 'Failed to fetch') {
      erreur.textContent = 'Erreur de connexion au serveur. Veuillez réessayer.';
    } else {
      erreur.textContent = err.message;
    }
    erreur.style.display = 'block';
  }
    });
  </script>
</body>
</html>
