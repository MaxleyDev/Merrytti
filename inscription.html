<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription – Merrytti</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f7f7f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h1 { font-size: 24px; margin-bottom: 10px; }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    button { width: 100%; padding: 12px; background: #c62828; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .error { background: #ffebee; color: #c62828; padding: 10px; border-radius: 6px; margin-bottom: 20px; display: none; }
    .success { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 6px; margin-bottom: 20px; display: none; }
    a { color: #c62828; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Créer un compte</h1>
    <div class="error" id="msgErreur"></div>
    <div class="success" id="msgSucces"></div>
    <form id="formInscription">
      <input type="hidden" id="csrf_jeton" value="">
      <div class="field">
        <label for="nom_utilisateur">Nom d'utilisateur</label>
        <input type="text" id="nom_utilisateur" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" required minlength="6">
      </div>
      <button type="submit">S'inscrire</button>
    </form>
    <p style="text-align:center; margin-top:20px;">Déjà un compte ? <a href="connexion.html">Se connecter</a></p>
  </div>

  <script>
    async function chargerCsrf() {
      try {
        const rep = await fetch('api/csrf_jeton.php');
        const data = await rep.json();
        document.getElementById('csrf_jeton').value = data.jeton;
      } catch(e) {}
    }
    chargerCsrf();

    document.getElementById('formInscription').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erreur = document.getElementById('msgErreur');
      const succes = document.getElementById('msgSucces');
      erreur.style.display = 'none';
      succes.style.display = 'none';

      const nom_utilisateur = document.getElementById('nom_utilisateur').value.trim();
      const email = document.getElementById('email').value.trim();
      const mot_de_passe = document.getElementById('mot_de_passe').value;
      const csrf = document.getElementById('csrf_jeton').value;

      try {
        const rep = await fetch('api/inscription.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nom_utilisateur, email, mot_de_passe, csrf_jeton: csrf })
        });
        const data = await rep.json();
        if (!rep.ok) throw new Error(data.erreur);
        succes.textContent = 'Compte créé ! Redirection...';
        succes.style.display = 'block';
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
      } catch (err) {
        erreur.textContent = err.message;
        erreur.style.display = 'block';
      }
    });
  </script>
</body>
</html>
